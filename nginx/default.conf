server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Hide the exact nginx version from responses
    server_tokens off;

    # Bind-mounted files change on the host: disable kernel send-file and
    # metadata caching so edits are visible on the next request
    sendfile off;
    open_file_cache off;
    etag on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    # Force revalidation so the browser never serves a stale page after an edit
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    # Dotfiles such as .git must never be exposed by the web server
    location ~ /\. {
        deny all;
    }
}
